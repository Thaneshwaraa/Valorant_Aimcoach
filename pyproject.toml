[project]
name = "valorant-voice-coach"
version = "0.1.0"
description = "Personalized AI voice coach for Valorant competitive players"
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- API layer ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    # --- persistence ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # --- RAG ---
    "chromadb>=0.5.20",
    "fastembed>=0.4.2",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.1.0",
    # --- observability / cli ---
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Installed in Phase 4-5. Kept separate so the text-only MVP stays light.
voice = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
    "numpy>=1.26.0,<2.2",
    "onnxruntime>=1.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in an argument default is the FastAPI idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
